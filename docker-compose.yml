services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viettel_telecom_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount thư mục data để lưu file viettel.db SQLite không bị mất khi restart container
      - ./data:/app/data
