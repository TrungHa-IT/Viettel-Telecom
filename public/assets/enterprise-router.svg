<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="24" fill="#F8FAFC"/>
  <!-- Server / Enterprise Rack Unit 1 -->
  <rect x="70" y="80" width="260" height="50" rx="8" fill="#1E293B"/>
  <rect x="85" y="96" width="35" height="18" rx="4" fill="#0F172A"/>
  <circle cx="95" cy="105" r="3" fill="#10B981"/>
  <circle cx="107" cy="105" r="3" fill="#3B82F6"/>
  <!-- Gigabit Ports -->
  <g fill="#334155">
    <rect x="135" y="95" width="14" height="20" rx="2"/>
    <rect x="155" y="95" width="14" height="20" rx="2"/>
    <rect x="175" y="95" width="14" height="20" rx="2"/>
    <rect x="195" y="95" width="14" height="20" rx="2"/>
    <rect x="215" y="95" width="14" height="20" rx="2"/>
    <rect x="235" y="95" width="14" height="20" rx="2"/>
  </g>
  <rect x="270" y="97" width="45" height="16" rx="3" fill="#EE0033"/>
  <text x="292.5" y="108" fill="white" font-size="8" font-weight="900" font-family="sans-serif" text-anchor="middle">10 Gbps</text>

  <!-- Enterprise Unit 2 -->
  <rect x="70" y="145" width="260" height="50" rx="8" fill="#0F172A"/>
  <rect x="85" y="161" width="35" height="18" rx="4" fill="#1E293B"/>
  <circle cx="95" cy="170" r="3" fill="#10B981"/>
  <circle cx="107" cy="170" r="3" fill="#EE0033"/>
  <!-- SFP+ Fiber Ports -->
  <g fill="#475569">
    <rect x="135" y="160" width="24" height="20" rx="2"/>
    <rect x="165" y="160" width="24" height="20" rx="2"/>
    <rect x="195" y="160" width="24" height="20" rx="2"/>
    <rect x="225" y="160" width="24" height="20" rx="2"/>
  </g>
  <text x="292.5" y="173" fill="#94A3B8" font-size="8" font-weight="700" font-family="sans-serif" text-anchor="middle">SLA 99.9%</text>

  <!-- Network Connection lines -->
  <path d="M147 200V230H200V250" stroke="#EE0033" stroke-width="3" stroke-linecap="round"/>
  <path d="M177 200V220H200" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="255" r="6" fill="#EE0033"/>

  <!-- Enterprise Badge -->
  <rect x="120" y="24" width="160" height="28" rx="14" fill="#EE0033"/>
  <text x="200" y="42" fill="white" font-size="11" font-weight="900" font-family="sans-serif" text-anchor="middle">DOANH NGHIỆP PRO</text>
</svg>
