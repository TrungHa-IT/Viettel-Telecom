<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Glowing gradient background -->
  <rect width="500" height="400" rx="32" fill="url(#heroBg)"/>
  
  <!-- Fiber Optic Speed Lines -->
  <path d="M-50 250C100 220 200 320 350 200C450 120 520 180 550 140" stroke="url(#lineGrad1)" stroke-width="4" stroke-linecap="round"/>
  <path d="M-50 200C120 180 180 280 320 150C420 50 480 120 550 80" stroke="url(#lineGrad2)" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10"/>
  <path d="M-50 300C80 280 220 360 380 240C460 180 500 220 550 200" stroke="#EE0033" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Speedometer & Tech Core -->
  <circle cx="250" cy="180" r="110" stroke="white" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="250" cy="180" r="85" stroke="#EE0033" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="6 6"/>
  <circle cx="250" cy="180" r="65" fill="#1E293B" stroke="white" stroke-width="2"/>

  <!-- Speed Indicator -->
  <text x="250" y="172" fill="#EE0033" font-size="28" font-weight="900" font-family="sans-serif" text-anchor="middle">1000</text>
  <text x="250" y="195" fill="#94A3B8" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">Mbps FTTH</text>

  <!-- Floating Feature Badges -->
  <g transform="translate(60, 80)">
    <rect width="110" height="38" rx="19" fill="#1E293B" stroke="#EE0033" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#10B981"/>
    <text x="35" y="23" fill="white" font-size="10" font-weight="800" font-family="sans-serif">Wi-Fi 7 Ready</text>
  </g>

  <g transform="translate(330, 80)">
    <rect width="115" height="38" rx="19" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#3B82F6"/>
    <text x="35" y="23" fill="white" font-size="10" font-weight="800" font-family="sans-serif">TV360 4K UHD</text>
  </g>

  <g transform="translate(70, 290)">
    <rect width="125" height="38" rx="19" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#F59E0B"/>
    <text x="35" y="23" fill="white" font-size="10" font-weight="800" font-family="sans-serif">Cloud Camera AI</text>
  </g>

  <g transform="translate(320, 290)">
    <rect width="120" height="38" rx="19" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#10B981"/>
    <text x="35" y="23" fill="white" font-size="10" font-weight="800" font-family="sans-serif">Lắp Đặt 24h</text>
  </g>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="500" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#330810"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0" y1="200" x2="500" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EE0033"/>
      <stop offset="0.5" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0" y1="250" x2="500" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
</svg>
